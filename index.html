function openAddSlotForDate(dateStr,time,existing){
  time=time||'09:00';
  editSlotId=existing?existing.id:null;
  slotPersons=existing&&existing.clients&&existing.clients.length>1?2:1;
  slotType2=existing&&existing.isTemplate?'weekly':'oneoff';

  document.getElementById('slot-modal-title').textContent=existing?'Edytuj slot':'Nowy slot';
  document.getElementById('slot-date').value=dateStr;
  document.getElementById('slot-time').value=time;
  document.getElementById('del-slot-btn').style.display=(existing&&!existing.isTemplate)?'block':'none';

  var times=['06:00','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00'];
  document.getElementById('tgrid').innerHTML=times.map(t=>`<button class="topt${t===time?' on':''}" onclick="selTime(this,'${t}')">${t}</button>`).join('');

  var opts=state.clients.map(c=>`<option value="${c.id}"${existing&&existing.clients&&existing.clients[0]===c.id?' selected':''}>${c.name}</option>`).join('');
  document.getElementById('slot-c1').innerHTML='<option value="">— Wybierz —</option>'+opts;
  var opts2=state.clients.map(c=>`<option value="${c.id}"${existing&&existing.clients&&existing.clients[1]===c.id?' selected':''}>${c.name}</option>`).join('');
  document.getElementById('slot-c2').innerHTML='<option value="">— Wybierz —</option>'+opts2;

  setPersons(slotPersons);setSlotType(slotType2);updateSlotPreview();
  document.getElementById('ov-slot').classList.add('on');
}

function selTime(btn,t){
  document.querySelectorAll('.topt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('slot-time').value=t;
}
function setPersons(n){
  slotPersons=n;
  document.getElementById('btn-1p').className='btn-s '+(n===1?'gr':'');
  document.getElementById('btn-2p').className='btn-s '+(n===2?'gr':'');
  document.getElementById('slot-c2-wrap').style.display=n===2?'block':'none';
  updateSlotPreview();
}
function setSlotType(t){
  slotType2=t;
  document.getElementById('btn-oneoff').className='btn-s '+(t==='oneoff'?'gr':'');
  document.getElementById('btn-weekly').className='btn-s '+(t==='weekly'?'gr':'');
}
function updateSlotPreview(){
  var c1=state.clients.find(c=>c.id===document.getElementById('slot-c1').value);
  var c2=slotPersons===2?state.clients.find(c=>c.id===document.getElementById('slot-c2')?.value):null;
  var isPair=slotPersons===2&&!!c2;
  var total=0;
  if(c1)total+=isPair?(c1.price2||c1.price1||0):(c1.price1||0);
  if(c2&&isPair)total+=(c2.price2||c2.price1||0);
  var prev=document.getElementById('slot-preview');
  prev.style.display=c1?'block':'none';
  document.getElementById('slot-preview-val').textContent=total+' zł';
}

function saveSlot(){
  var time=document.getElementById('slot-time').value;
  var date=document.getElementById('slot-date').value;
  var c1=document.getElementById('slot-c1').value;
  var c2=slotPersons===2?document.getElementById('slot-c2').value:'';
  if(!time||!date){alert('Wybierz godzinę i datę!');return;}
  var clients=[c1,c2].filter(Boolean);
  var isPair=clients.length>1;

  if(slotType2==='weekly'){
    var d=new Date(date+'T12:00:00');
    if(!state.templates)state.templates=[];
    var tplId=(editSlotId&&editSlotId.startsWith('tpl_'))?editSlotId.split('_')[1]:'tpl-'+Date.now();
    var tpl={id:tplId,time,day:d.getDay(),client1:c1,client2:c2||null,repeat:'weekly'};
    var idx=state.templates.findIndex(t=>t.id===tplId);
    if(idx>=0)state.templates[idx]=tpl;else state.templates.push(tpl);
  } else {
    if(editSlotId&&!editSlotId.startsWith('tpl_')){
      var slot=(state.slots||[]).find(s=>s.id===editSlotId);
      if(slot){slot.time=time;slot.date=date;slot.clients=clients;slot.isPair=isPair;}
    } else {
      if(!state.slots)state.slots=[];
      state.slots.push({id:'slot-'+Date.now(),time,date,clients,isPair,done:false,absent:false,payments:{}});
    }
  }
  save();closeOv('ov-slot');renderGrafik();renderToday();flash('✓ Slot zapisany');
}
function deleteSlot(){
  if(!editSlotId||!confirm('Usunąć slot?'))return;
  state.slots=(state.slots||[]).filter(s=>s.id!==editSlotId);
  save();closeOv('ov-slot');renderGrafik();renderToday();
}

function exportPDF(){

  var allS=state.sessions||[];
  var monthS=allS.filter(s=>{var d=new Date(s.date);return d.getMonth()===month&&d.getFullYear()===year;}).sort((a,b)=>a.date.localeCompare(b.date));
  var total=monthS.reduce((s,x)=>s+(x.total||0),0);
  var cash=monthS.reduce((s,x)=>s+(x.cashTotal||0),0);
  var trans=monthS.reduce((s,x)=>s+(x.transferTotal||0),0);
  var rows=monthS.map(s=>{
    var names=s.clients.map(id=>{var c=state.clients.find(x=>x.id===id);return c?c.name:'?';}).join(', ');
    var cash2=(s.cashTotal||0),trans2=(s.transferTotal||0);
    return`<tr><td>${s.date}</td><td>${s.time||''}</td><td>${names}</td><td>${cash2?`💵${cash2}zł`:''} ${trans2?`🏦${trans2}zł`:''}</td><td style="text-align:right;font-weight:600">${s.total||0} zł</td></tr>`;
  }).join('');
  var html=`<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><title>Raport</title><style>body{font-family:Arial,sans-serif;font-size:12px;padding:28px;color:#111}.hdr{display:flex;justify-content:space-between;border-bottom:3px solid #e8302a;padding-bottom:14px;margin-bottom:20px}.logo{font-size:26px;font-weight:900;color:#e8302a}.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.sc{background:#f8f8f8;border-radius:6px;padding:12px;border-left:3px solid #e8302a}.sv{font-size:20px;font-weight:800;color:#e8302a}.sl{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}table{width:100%;border-collapse:collapse}th{background:#1a1a1a;color:#fff;padding:7px 9px;text-align:left;font-size:10px;text-transform:uppercase}td{padding:7px 9px;border-bottom:1px solid #f0f0f0;font-size:11px}tr:nth-child(even) td{background:#fafafa}.tot td{font-weight:700;border-top:2px solid #e8302a}</style></head><body>
  <div class="hdr"><div><div class="logo">PROGRESS</div><div style="font-size:10px;color:#888;letter-spacing:2px">Nawyki · Wrocław</div></div><div style="text-align:right"><div style="font-size:16px;font-weight:700">Raport miesięczny</div><div style="font-size:11px;color:#888">${now.toLocaleString('pl',{month:'long',year:'numeric'})}</div></div></div>
  <div class="sum"><div class="sc"><div class="sv">${total} zł</div><div class="sl">Łączny przychód</div></div><div class="sc"><div class="sv">${monthS.length}</div><div class="sl">Treningów</div></div><div class="sc" style="border-color:#f59e0b"><div class="sv" style="color:#f59e0b">${cash} zł</div><div class="sl">💵 Gotówka</div></div><div class="sc" style="border-color:#60a5fa"><div class="sv" style="color:#60a5fa">${trans} zł</div><div class="sl">🏦 Przelew</div></div></div>
  <table><tr><th>Data</th><th>Czas</th><th>Klient</th><th>Płatność</th><th style="text-align:right">Kwota</th></tr>${rows}<tr class="tot"><td colspan="4"><strong>SUMA</strong></td><td style="text-align:right">${total} zł</td></tr></table>
  </body></html>`;
  var w=window.open('','_blank');if(w){w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),600);}
}
